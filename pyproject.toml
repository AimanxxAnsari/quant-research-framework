[project]
name = "quant-research-framework"
version = "0.1.0"
description = "Cross-asset quant research framework: point-in-time data foundation, statistics, futures, backtesting and validation, risk, portfolio construction, volatility and regime models."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "matplotlib>=3.11.2",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "requests>=2.32",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
]

[project.scripts]
qrf = "quant_research.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=2.4.1",
    "pandas-stubs>=3.1.0.261029",
    "types-pyyaml>=6.0.12.20261122",
    "types-requests>=2.33.0.20261030",
    "pre-commit>=4.7.0",
    "scipy-stubs>=1.18.1.1",
    "vectorbt>=1.2.1",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "quant_research"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.12"
files = ["src"]
warn_unused_ignores = true
warn_redundant_casts = true

# statsmodels, arch and vectorbt ship without type information.
[[tool.mypy.overrides]]
module = ["statsmodels.*", "arch.*", "vectorbt.*"]
ignore_missing_imports = true

# Core maths is checked strictly (ADR-0007). Plumbing, studies and plotting use standard mode.
[[tool.mypy.overrides]]
module = [
    "quant_research.errors",
    "quant_research._typing",
    "quant_research.stats.*",
    "quant_research.risk.*",
    "quant_research.validation.*",
    "quant_research.backtest.*",
]
# The strict flags are listed one by one: `strict = true` inside an override leaks to every
# module in mypy 2.x.
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
extra_checks = true
no_implicit_reexport = true
strict_equality = true
warn_return_any = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
