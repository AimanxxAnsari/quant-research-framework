# Checks that run on every commit. Install once with: uv run pre-commit install
# ruff and mypy run from the project's own environment, so their versions come from uv.lock.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: detect-private-key

  - repo: local
    hooks:
      - id: hygiene
        name: private folders, secrets and em dashes
        entry: uv run python scripts/check_hygiene.py
        language: system
        types: [file]
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy (strict on core maths)
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
